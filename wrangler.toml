name = "fathom-resumen"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

account_id = "93695b987a7460c681c06ca4df901ef4"

routes = [
  { pattern = "resumen.fathom.superleads.mx", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "fathom-resumen-db"
database_id = "7b626233-67da-41a5-a6b1-2db1c3828f76"

# Réplica de solo lectura de fanthom-superleads — únicamente para reconstruir
# y reintentar manualmente un resumen (ver src/db.ts reconstruirTrigger).
[[d1_databases]]
binding = "FANTHOM_DB"
database_name = "fanthom-db"
database_id = "22d59ce7-2034-4395-a105-dd069c89d470"

[[r2_buckets]]
binding = "R2"
bucket_name = "fanthom-transcripciones"

[[queues.consumers]]
queue = "fanthom-resumen-trigger"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
